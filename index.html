<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Diwali Greetings - Venkat, Vidya, Vatsal, Stuthi & Shantha</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050b14;
            color: #fce7f3;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: manipulation;
        }

        .font-cinzel {
            font-family: 'Cinzel Decorative', cursive, serif;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        /* Gold Gradient Text */
        .gold-text-gradient {
            background: linear-gradient(135deg, #FFF5C0 0%, #FFD700 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* Glowing Diya Lights */
        .diya-flame {
            background: radial-gradient(circle, #fff 10%, #fef08a 30%, #f97316 70%, transparent 100%);
            box-shadow: 0 0 25px #f97316, 0 0 45px #eab308;
            animation: flicker 1.5s infinite alternate ease-in-out;
        }

        @keyframes flicker {
            0% { transform: scale(1) translateY(0); opacity: 0.9; }
            50% { transform: scale(1.15) translateY(-2px); opacity: 1; }
            100% { transform: scale(0.95) translateY(1px); opacity: 0.85; }
        }

        /* Glassmorphic Cards */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(250, 204, 21, 0.1);
        }

        /* Canvas Fullscreen Layering */
        #mainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            touch-action: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }

        /* Pulsing Glow Animation */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 24px rgba(245, 158, 11, 0.9); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <!-- Interactive Fireworks & Sailing Ship Canvas -->
    <canvas id="mainCanvas"></canvas>

    <!-- Header Overlay -->
    <header class="relative z-20 w-full p-3 sm:p-5 flex justify-between items-center max-w-7xl mx-auto">
        <!-- Festive Logo / Icon -->
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 shrink-0">
                <i class="fa-solid fa-lightbulb text-amber-950 text-lg sm:text-xl"></i>
            </div>
            <div>
                <span class="font-cinzel text-amber-300 text-xs sm:text-sm font-bold tracking-widest block leading-tight">DEEPAVALI</span>
                <span class="text-[10px] sm:text-xs text-amber-200/70 tracking-wider">FESTIVAL OF LIGHTS</span>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Audio Toggle Button -->
            <button id="audioBtn" aria-label="Toggle Sound" class="glass-panel px-3 py-2 sm:px-4 sm:py-2.5 rounded-full text-amber-300 hover:text-amber-100 transition-all flex items-center gap-1.5 text-xs sm:text-sm shadow-md active:scale-95">
                <i id="audioIcon" class="fa-solid fa-volume-xmark text-amber-400"></i>
                <span id="audioText" class="hidden sm:inline">Sound: Off</span>
            </button>

            <!-- Fire Cracker Burst Button -->
            <button id="fireworksBtn" aria-label="Launch Sky Crackers" class="glass-panel px-3 py-2 sm:px-4 sm:py-2.5 rounded-full text-amber-300 hover:text-amber-100 transition-all flex items-center gap-1.5 text-xs sm:text-sm shadow-md active:scale-95">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                <span class="hidden sm:inline">Launch Sky Crackers</span>
            </button>
        </div>
    </header>

    <!-- Main Content Greeting Area -->
    <main class="relative z-20 flex-1 flex flex-col items-center justify-center p-3 sm:p-4 text-center max-w-4xl mx-auto w-full pointer-events-none">
        
        <!-- Greeting Banner -->
        <div class="glass-panel p-4 sm:p-7 rounded-2xl sm:rounded-3xl w-full max-w-2xl border border-amber-500/40 relative overflow-hidden pointer-events-auto transform transition-all duration-300">
            <!-- Ornamental Border Corners -->
            <div class="absolute top-2 left-2 text-amber-400/60 text-sm sm:text-lg">✦</div>
            <div class="absolute top-2 right-2 text-amber-400/60 text-sm sm:text-lg">✦</div>
            <div class="absolute bottom-2 left-2 text-amber-400/60 text-sm sm:text-lg">✦</div>
            <div class="absolute bottom-2 right-2 text-amber-400/60 text-sm sm:text-lg">✦</div>

            <div class="text-amber-400 text-[10px] sm:text-xs uppercase tracking-[0.2em] sm:tracking-[0.3em] font-semibold mb-1">
                ✨ Wishing You Joy, Prosperity & Happiness ✨
            </div>

            <!-- Main Big Greeting -->
            <h1 class="font-cinzel gold-text-gradient text-2xl sm:text-5xl md:text-6xl font-bold leading-tight my-1 drop-shadow-md">
                HAPPY DIWALI
            </h1>
            <p class="font-script text-xl sm:text-3xl md:text-4xl text-amber-200 mt-0.5 mb-1 sm:mb-2">
                & a Prosperous New Year
            </p>

            <div class="w-24 sm:w-32 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto my-2 sm:my-3"></div>

            <!-- Family Names Section -->
            <p class="text-[11px] sm:text-xs md:text-sm text-amber-100/80 mb-2 font-light">With Warm Best Wishes & Regards From:</p>
            <div class="flex flex-wrap justify-center items-center gap-1.5 sm:gap-2.5 text-amber-300 font-semibold text-xs sm:text-base">
                <span class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-amber-500/10 border border-amber-500/20 shadow-sm">Venkat</span>
                <span class="text-amber-500 text-xs">•</span>
                <span class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-amber-500/10 border border-amber-500/20 shadow-sm">Vidya</span>
                <span class="text-amber-500 text-xs">•</span>
                <span class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-amber-500/10 border border-amber-500/20 shadow-sm">Vatsal</span>
                <span class="text-amber-500 text-xs">•</span>
                <span class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-amber-500/10 border border-amber-500/20 shadow-sm">Stuthi</span>
                <span class="text-amber-500 text-xs">•</span>
                <span class="px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full bg-amber-500/10 border border-amber-500/20 shadow-sm">Shantha</span>
            </div>

            <!-- Action Prompt & Horn Trigger Button -->
            <div class="mt-4 sm:mt-5 flex flex-col sm:flex-row items-center justify-center gap-3">
                <button id="shipHornBtn" class="pulse-glow bg-gradient-to-r from-amber-600 via-amber-500 to-yellow-500 text-amber-950 font-bold px-5 py-2 sm:px-6 sm:py-2.5 rounded-full text-xs sm:text-sm flex items-center gap-2 transform active:scale-95 transition-all shadow-xl hover:brightness-110">
                    <i class="fa-solid fa-ship text-sm sm:text-base"></i>
                    <span>Blow Ship Horn & Steam!</span>
                </button>
            </div>
            
            <p class="text-[10px] sm:text-xs text-amber-300/60 mt-2 italic">
                <i class="fa-solid fa-hand-pointer mr-1"></i> Tap anywhere on the sky to launch fireworks!
            </p>
        </div>
    </main>

    <!-- Bottom Traditional Diyas Bar Overlay -->
    <footer class="relative z-20 w-full p-2 sm:p-4 max-w-5xl mx-auto flex justify-around items-center pointer-events-none">
        <!-- Diya 1 -->
        <div class="flex flex-col items-center">
            <div class="w-3 h-5 sm:w-4 sm:h-6 rounded-full diya-flame mb-[-3px] relative z-10"></div>
            <div class="w-9 h-4 sm:w-12 sm:h-6 bg-gradient-to-b from-amber-700 to-amber-900 rounded-b-full border-t border-amber-400 shadow-lg relative">
                <div class="absolute inset-x-0 top-0 h-0.5 sm:h-1 bg-yellow-400/40 rounded-full"></div>
            </div>
        </div>

        <!-- Diya 2 -->
        <div class="flex flex-col items-center">
            <div class="w-4 h-6 sm:w-5 sm:h-7 rounded-full diya-flame mb-[-3px] relative z-10"></div>
            <div class="w-11 h-5 sm:w-14 sm:h-7 bg-gradient-to-b from-amber-700 to-amber-900 rounded-b-full border-t border-amber-400 shadow-lg relative">
                <div class="absolute inset-x-0 top-0 h-0.5 sm:h-1 bg-yellow-400/40 rounded-full"></div>
            </div>
        </div>

        <!-- Central Greeting Ribbon -->
        <div class="hidden sm:block text-center glass-panel px-6 py-2 rounded-full border border-amber-500/30">
            <span class="text-xs text-amber-300 font-cinzel tracking-widest">✨ LIGHT OVER DARKNESS • JOY OVER SORROW ✨</span>
        </div>

        <!-- Diya 3 -->
        <div class="flex flex-col items-center">
            <div class="w-4 h-6 sm:w-5 sm:h-7 rounded-full diya-flame mb-[-3px] relative z-10"></div>
            <div class="w-11 h-5 sm:w-14 sm:h-7 bg-gradient-to-b from-amber-700 to-amber-900 rounded-b-full border-t border-amber-400 shadow-lg relative">
                <div class="absolute inset-x-0 top-0 h-0.5 sm:h-1 bg-yellow-400/40 rounded-full"></div>
            </div>
        </div>

        <!-- Diya 4 -->
        <div class="flex flex-col items-center">
            <div class="w-3 h-5 sm:w-4 sm:h-6 rounded-full diya-flame mb-[-3px] relative z-10"></div>
            <div class="w-9 h-4 sm:w-12 sm:h-6 bg-gradient-to-b from-amber-700 to-amber-900 rounded-b-full border-t border-amber-400 shadow-lg relative">
                <div class="absolute inset-x-0 top-0 h-0.5 sm:h-1 bg-yellow-400/40 rounded-full"></div>
            </div>
        </div>
    </footer>

    <!-- Main JavaScript Logic -->
    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width = 0;
        let height = 0;
        let isMobile = false;

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            isMobile = width < 768;
            initStars();
            updateShipDimensions();
        }

        window.addEventListener('resize', resizeCanvas);

        // WEB AUDIO API
        let audioCtx = null;
        let isAudioEnabled = false;
        let ambientOsc1 = null;
        let ambientGain = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playShipHorn() {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(110, now);
            osc1.frequency.exponentialRampToValueAtTime(105, now + 2.5);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(165, now);
            osc2.frequency.exponentialRampToValueAtTime(158, now + 2.5);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);
            filter.Q.setValueAtTime(3, now);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.4, now + 0.3);
            masterGain.gain.setValueAtTime(0.4, now + 2.0);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

            osc1.connect(gain1);
            osc2.connect(gain2);
            gain1.connect(filter);
            gain2.connect(filter);
            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 2.9);
            osc2.stop(now + 2.9);

            triggerShipSteam();
        }

        function toggleAmbientMusic() {
            initAudio();
            if (!audioCtx) return;

            if (isAudioEnabled) {
                if (ambientGain) {
                    ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
                    setTimeout(() => {
                        if (ambientOsc1) ambientOsc1.stop();
                    }, 1000);
                }
                isAudioEnabled = false;
                document.getElementById('audioIcon').className = 'fa-solid fa-volume-xmark text-amber-400';
                document.getElementById('audioText').innerText = 'Sound: Off';
            } else {
                const now = audioCtx.currentTime;
                ambientOsc1 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                ambientGain = audioCtx.createGain();

                ambientOsc1.type = 'sine';
                ambientOsc1.frequency.setValueAtTime(146.83, now);

                const lfo = audioCtx.createOscillator();
                lfo.frequency.setValueAtTime(0.2, now);
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.setValueAtTime(3, now);
                lfo.connect(ambientOsc1.frequency);
                lfo.start(now);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, now);

                ambientGain.gain.setValueAtTime(0.001, now);
                ambientGain.gain.linearRampToValueAtTime(0.12, now + 2);

                ambientOsc1.connect(filter);
                filter.connect(ambientGain);
                ambientGain.connect(audioCtx.destination);

                ambientOsc1.start(now);
                isAudioEnabled = true;
                document.getElementById('audioIcon').className = 'fa-solid fa-volume-high text-amber-400';
                document.getElementById('audioText').innerText = 'Sound: On';
            }
        }

        function playFireworkSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(now);
            } catch(e) {}
        }

        // STARFIELD
        let stars = [];
        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / (isMobile ? 5000 : 3000));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.75),
                    radius: Math.random() * (isMobile ? 1.2 : 1.5) + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function drawStars() {
            for (let star of stars) {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                ctx.save();
                ctx.fillStyle = `rgba(255, 245, 215, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // FIREWORKS SIMULATION
        let fireworks = [];
        let particles = [];
        const fwColors = ['#ff416c', '#ff4b2b', '#ffb347', '#ffcc00', '#00ffff', '#70e000', '#e0aaff', '#ffffff', '#f43f5e', '#a855f7'];

        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = 4;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 30 + 70;
                this.color = fwColors[Math.floor(Math.random() * fwColors.length)];
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.targetX, this.targetY, this.color);
                    playFireworkSound();
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = isMobile ? 1.8 : 2.5;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = isMobile ? 3 : 4;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * (isMobile ? 6 : 9) + 1;
                this.friction = 0.95;
                this.gravity = 0.7;
                this.color = color;
                this.rgb = hexToRgb(color);
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + (isMobile ? 0.015 : 0.008);
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `rgba(${this.rgb}, ${this.alpha})`;
                ctx.lineWidth = isMobile ? 1.5 : 2;
                ctx.stroke();
            }
        }

        function hexToRgb(hex) {
            let c;
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                c = hex.substring(1).split('');
                if (c.length == 3) {
                    c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                return [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',');
            }
            return '255, 215, 0';
        }

        function createParticles(x, y, color) {
            let particleCount = isMobile ? 35 : 65;
            while (particleCount--) {
                particles.push(new Particle(x, y, color));
            }
        }

        function launchRandomFirework() {
            const startX = Math.random() * width;
            const startY = height;
            const targetX = Math.random() * (width * 0.9) + width * 0.05;
            const targetY = Math.random() * (height * 0.4) + 30;
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        }

        function launchMultipleFireworks(count = 6) {
            initAudio();
            const burstCount = isMobile ? Math.min(count, 5) : count;
            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => {
                    launchRandomFirework();
                }, i * 200);
            }
        }

        let lastAutoFirework = 0;
        function handleAutoFireworks(timestamp) {
            const interval = isMobile ? 2200 : 1400;
            if (timestamp - lastAutoFirework > interval) {
                launchRandomFirework();
                lastAutoFirework = timestamp;
            }
        }

        // SAILING SHIP & STEAM PARTICLES
        const ship = {
            x: -200,
            y: 0,
            width: 140,
            height: 70,
            speed: 0.8,
            bobOffset: 0
        };

        function updateShipDimensions() {
            if (isMobile) {
                ship.width = 90;
                ship.height = 45;
                ship.speed = 0.65;
            } else {
                ship.width = 140;
                ship.height = 70;
                ship.speed = 0.95;
            }
        }

        let steamParticles = [];

        function triggerShipSteam() {
            const count = isMobile ? 25 : 45;
            for (let i = 0; i < count; i++) {
                steamParticles.push({
                    x: ship.x + ship.width * 0.45,
                    y: ship.y - (isMobile ? 15 : 25),
                    vx: (Math.random() - 0.5) * 1.5 - 1.2,
                    vy: -(Math.random() * 2 + 1.5),
                    radius: Math.random() * (isMobile ? 3.5 : 5) + 2,
                    alpha: 0.8,
                    growth: Math.random() * 0.2 + 0.1
                });
            }
        }

        function updateAndDrawSteam() {
            for (let i = steamParticles.length - 1; i >= 0; i--) {
                const p = steamParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.radius += p.growth;
                p.alpha -= 0.01;

                if (p.alpha <= 0) {
                    steamParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 240, 255, ${p.alpha})`;
                ctx.fill();
                ctx.restore();
            }
        }

        function drawShip(waterY, time) {
            ship.x += ship.speed;
            if (ship.x > width + 100) {
                ship.x = -ship.width - 50;
            }

            const yOffset = isMobile ? 5 : 10;
            ship.bobOffset = Math.sin(time * 0.003) * (isMobile ? 2.5 : 4);
            ship.y = waterY + yOffset + ship.bobOffset;

            ctx.save();
            ctx.translate(ship.x, ship.y);

            const scale = isMobile ? 0.65 : 1.0;
            ctx.scale(scale, scale);

            const rotation = Math.sin(time * 0.002) * 0.025;
            ctx.rotate(rotation);

            const hullGrad = ctx.createLinearGradient(0, 30, 0, 70);
            hullGrad.addColorStop(0, '#1e293b');
            hullGrad.addColorStop(0.5, '#0f172a');
            hullGrad.addColorStop(1, '#020617');

            ctx.beginPath();
            ctx.moveTo(8, 35);
            ctx.lineTo(128, 35);
            ctx.quadraticCurveTo(148, 35, 136, 58);
            ctx.lineTo(20, 62);
            ctx.quadraticCurveTo(0, 58, 8, 35);
            ctx.fillStyle = hullGrad;
            ctx.fill();
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(6, 40);
            ctx.lineTo(132, 40);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.fillStyle = '#334155';
            ctx.fillRect(32, 15, 62, 20);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.strokeRect(32, 15, 62, 20);

            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 6;
            for (let w = 40; w <= 80; w += 12) {
                ctx.fillRect(w, 20, 6, 6);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#991b1b';
            ctx.fillRect(60, -4, 11, 19);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(58, -7, 15, 4);

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(42, 15);
            ctx.lineTo(42, -20);
            ctx.stroke();

            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(42, -20);
            ctx.lineTo(58, -16);
            ctx.lineTo(42, -12);
            ctx.closePath();
            ctx.fill();

            const lightColors = ['#f43f5e', '#eab308', '#22c55e', '#3b82f6'];
            let colorIdx = 0;
            ctx.beginPath();
            for (let lx = 12; lx <= 125; lx += 10) {
                const ly = 32 + Math.sin(lx * 0.1) * 2;
                ctx.fillStyle = lightColors[(colorIdx++) % lightColors.length];
                ctx.beginPath();
                ctx.arc(lx, ly, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            if (Math.random() < 0.25) {
                steamParticles.push({
                    x: ship.x + ship.width * 0.45,
                    y: ship.y - (isMobile ? 4 : 7),
                    vx: -0.8 + (Math.random() - 0.5) * 0.5,
                    vy: -(Math.random() * 1 + 0.5),
                    radius: Math.random() * 2 + 1.5,
                    alpha: 0.5,
                    growth: 0.08
                });
            }
        }

        // ANIMATED WATER & REFLECTIONS
        function drawWater(time) {
            const waterY = height * (isMobile ? 0.85 : 0.81);

            const waterGrad = ctx.createLinearGradient(0, waterY, 0, height);
            waterGrad.addColorStop(0, '#031329');
            waterGrad.addColorStop(0.5, '#020b18');
            waterGrad.addColorStop(1, '#01050d');

            ctx.fillStyle = waterGrad;
            ctx.fillRect(0, waterY, width, height - waterY);

            ctx.save();
            ctx.strokeStyle = 'rgba(217, 119, 6, 0.15)';
            ctx.lineWidth = 1.5;

            const waveCount = isMobile ? 3 : 5;
            for (let i = 0; i < waveCount; i++) {
                ctx.beginPath();
                const waveY = waterY + i * (isMobile ? 12 : 16);
                for (let x = 0; x <= width; x += 30) {
                    const y = waveY + Math.sin(x * 0.01 + time * 0.002 + i) * (3 + i);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            for (let p of particles) {
                if (p.y < waterY && Math.random() < 0.15) {
                    const reflY = waterY + (waterY - p.y) * 0.2;
                    if (reflY < height) {
                        ctx.fillStyle = `rgba(${p.rgb}, ${p.alpha * 0.3})`;
                        ctx.fillRect(p.x + (Math.random() - 0.5) * 10, reflY, Math.random() * 6 + 2, 2);
                    }
                }
            }

            ctx.restore();
            return waterY;
        }

        // MAIN ANIMATION LOOP
        function animate(timestamp) {
            ctx.fillStyle = 'rgba(5, 11, 20, 0.25)';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            handleAutoFireworks(timestamp);

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].draw();
                particles[i].update(i);
            }

            const waterY = drawWater(timestamp);
            drawShip(waterY, timestamp);
            updateAndDrawSteam();

            requestAnimationFrame(animate);
        }

        // INTERACTION HANDLERS
        function handleTriggerLaunch(e) {
            if (e.target.closest('button') || e.target.closest('.glass-panel')) return;

            let clickX = e.clientX;
            let clickY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clickX = e.touches[0].clientX;
                clickY = e.touches[0].clientY;
            }

            const startX = clickX + (Math.random() - 0.5) * 60;
            fireworks.push(new Firework(startX, height, clickX, clickY));
        }

        window.addEventListener('click', handleTriggerLaunch);
        window.addEventListener('touchstart', (e) => {
            if (!e.target.closest('button') && !e.target.closest('.glass-panel')) {
                handleTriggerLaunch(e);
            }
        }, { passive: true });

        document.getElementById('shipHornBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playShipHorn();
        });

        document.getElementById('fireworksBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            launchMultipleFireworks(6);
        });

        document.getElementById('audioBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAmbientMusic();
        });

        window.onload = function() {
            resizeCanvas();
            requestAnimationFrame(animate);
            setTimeout(() => {
                launchMultipleFireworks(isMobile ? 4 : 6);
            }, 500);
        };
    </script>
</body>
</html>
